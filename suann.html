<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suann | Fortune Cookie</title>
  <style>
    * { box-sizing: border-box; font-family: Helvetica, Arial, sans-serif; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
    #cookieScreen { position: relative; width: 100%; height: 100vh; overflow: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 28px; background: #000; }
    #cookieScreen::before { position: absolute; inset: 0; z-index: 0; content: ''; background: url('geminibg.jpg') center / cover no-repeat; opacity: 0; filter: blur(4px); transform: translateY(18px) scale(.98); transition: opacity 1.2s ease, filter 1.2s ease, transform 1.2s ease; }
    #cookieScreen.sky-background::before { opacity: 1; filter: blur(0); transform: none; }
    .cookie-image, .cookie-actions { position: relative; z-index: 1; }
    .cookie-image { cursor: pointer; }
    .cookie-image img { display: block; width: min(420px, 78vw); height: auto; }
    .cookie-image .cookie-piece { position: absolute; inset: 0; opacity: 0; pointer-events: none; }
    .cookie-image .piece-one { clip-path: polygon(0 0,54% 0,47% 48%,0 54%); }
    .cookie-image .piece-two { clip-path: polygon(54% 0,100% 0,100% 52%,47% 48%); }
    .cookie-image .piece-three { clip-path: polygon(0 54%,47% 48%,53% 100%,0 100%); }
    .cookie-image .piece-four { clip-path: polygon(47% 48%,100% 52%,100% 100%,53% 100%); }
    .cookie-image.breaking .cookie-base { opacity: 0; }
    .cookie-image.breaking .cookie-piece { opacity: 1; animation: .8s cubic-bezier(.2,.8,.3,1) forwards; }
    .cookie-image.breaking .piece-one { animation-name: piece-one; }
    .cookie-image.breaking .piece-two { animation-name: piece-two; }
    .cookie-image.breaking .piece-three { animation-name: piece-three; }
    .cookie-image.breaking .piece-four { animation-name: piece-four; }
    @keyframes piece-one { to { transform: translate(-34px,-42px) rotate(-12deg); opacity: .78; } }
    @keyframes piece-two { to { transform: translate(38px,-30px) rotate(14deg); opacity: .78; } }
    @keyframes piece-three { to { transform: translate(-30px,44px) rotate(13deg); opacity: .78; } }
    @keyframes piece-four { to { transform: translate(42px,38px) rotate(-15deg); opacity: .78; } }
    .cookie-actions { display: flex; flex-direction: column; gap: 16px; align-items: center; min-height: 120px; }
    .cookie-action { padding: 10px 22px; border: 0; background: transparent; color: #fff; letter-spacing: 2px; cursor: pointer; transition: background .3s, color .3s; }
    .cookie-action:hover { background: #fff; color: #000; }
  </style>
</head>
<body>
  <main id="cookieScreen">
    <div class="cookie-image" id="cookieImage"><img class="cookie-base" src="fortunecookie.png" alt="Fortune Cookie"><img class="cookie-piece piece-one" src="fortunecookie.png" alt=""><img class="cookie-piece piece-two" src="fortunecookie.png" alt=""><img class="cookie-piece piece-three" src="fortunecookie.png" alt=""><img class="cookie-piece piece-four" src="fortunecookie.png" alt=""></div>
    <div class="cookie-actions"><button class="cookie-action" id="returnButton">RETURN TO MAIN</button><button class="cookie-action" id="breakButton">BREAK YOUR FATE (click the cookie)</button></div>
  </main>
  <script>
    const cookieScreen = document.getElementById('cookieScreen');
    const cookieImage = document.getElementById('cookieImage');
    const breakCookie = () => {
      cookieImage.classList.remove('breaking');
      void cookieImage.offsetWidth;
      cookieImage.classList.add('breaking');
      cookieScreen.classList.add('sky-background');
      setTimeout(() => { window.location.href = 'fate.html'; }, 900);
    };
    cookieImage.addEventListener('click', breakCookie);
    document.getElementById('breakButton').addEventListener('click', breakCookie);
    document.getElementById('returnButton').addEventListener('click', () => { window.location.href = 'index.html'; });
  </script>
</body>
</html>
