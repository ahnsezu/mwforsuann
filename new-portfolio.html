<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>New Portfolio | Suann</title>
	<style>
		:root {
			--paper: #e8e5e0;
			--ink: #171717;
			--line: rgba(23, 23, 23, 0.22);
		}

		* {
			box-sizing: border-box;
		}

		html,
		body {
			min-height: 100%;
			margin: 0;
			background: var(--paper);
			color: var(--ink);
			font-family: Helvetica, Arial, sans-serif;
		}

		body {
			padding: 32px;
		}

		.page {
			max-width: 1200px;
			margin: 0 auto;
		}

		header {
			display: flex;
			justify-content: space-between;
			align-items: baseline;
			padding-bottom: 18px;
			border-bottom: 1px solid var(--line);
		}

		h1 {
			margin: 0;
			font-size: clamp(30px, 6vw, 76px);
			font-weight: 400;
			letter-spacing: 1px;
			line-height: 1;
			white-space: nowrap;
		}

		a {
			color: inherit;
			text-decoration: none;
		}

		a:hover {
			text-decoration: underline;
			text-underline-offset: 4px;
		}

		.work-link {
			display: block;
		}

		nav {
		font-size: 13px;
		letter-spacing: 1px;
		text-transform: uppercase;
	}

	.intro {
		max-width: 600px;
		margin: 50px 0 70px;
		font-size: clamp(20px, 3vw, 34px);
		line-height: 1.3;
	}

	.work-list {
		display: grid;
		grid-template-columns: repeat(2, minmax(0, 1fr));
		gap: 12px;
	}

	.work {
		display: flex;
		flex-direction: column;
		gap: 12px;
		padding: 12px 0 0;
		border-top: 1px solid var(--line);
	}

	.number {
		font-size: 13px;
		letter-spacing: 1px;
	}

	.work h2 {
		margin: 0 0 7px;
		font-size: clamp(20px, 3vw, 34px);
		font-weight: 400;
		letter-spacing: 0.5px;
	}

	.work p {
		margin: 0;
		font-size: 14px;
		line-height: 1.5;
	}

	.work img {
		display: block;
		width: 100%;
		height: 320px;
		object-fit: contain;
		background: #d5d1ca;
	}

	footer {
		padding: 70px 0 20px;
		font-size: 12px;
		letter-spacing: 1px;
		text-transform: uppercase;
	}

	@media (max-width: 680px) {
		body {
			padding: 20px;
		}

		header {
			align-items: flex-start;
			flex-direction: column;
			gap: 18px;
		}

		.work {
			gap: 10px;
		}

		.work img {
			height: 240px;
		}

		.work-list {
			grid-template-columns: 1fr;
		}
	}
</style>
</head>
<body>
	<main class="page">
		<header>
			<h1>PORTFOLIO</h1>
			<nav><a href="index.html">Back to main</a></nav>
		</header>

		<p class="intro">Photography, design and visual research.<br>work by suann</p>

		<section class="work-list" aria-label="Selected work">
			<a class="work-link" href="visual-design.html">
			<article class="work">
				<span class="number">01</span>
				<div>
					<h2>Visual Design</h2>
					<p>Image-making and visual systems for independent projects.</p>
				</div>
				<img src="museionworks.png" alt="Museion Works frame">
			</article>
			</a>

			<a class="work-link" href="photography.html">
			<article class="work">
				<span class="number">02</span>
				<div>
					<h2>Photography</h2>
					<p>Personal photography exploring atmosphere, space and memory.</p>
				</div>
				<img src="suannpf.png" alt="Suann frame">
			</article>
			</a>
		</section>

		<footer>ahnsuann@kakao.com</footer>
	</main>
</body>
</html>
