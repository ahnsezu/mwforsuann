<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>suann/title>
  <style>
    * { box-sizing: border-box; font-family: Helvetica, Arial, sans-serif; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
    button, input { font: inherit; }
    #mainScreen { position: absolute; inset: 0; z-index: 10; display: flex; justify-content: center; align-items: center; background: #e8e5e0; background-image: radial-gradient(ellipse at 18% 16%, rgba(255,255,255,.2), transparent 38%), radial-gradient(ellipse at 82% 74%, rgba(83,76,69,.08), transparent 42%); transition: opacity 2s ease, filter 2s ease, transform 2s ease; }
    #mainScreen.melt { opacity: 0; filter: blur(15px); transform: scale(.97); pointer-events: none; }
    .frame-container { width: 100%; padding: 24px; display: flex; gap: 50px; justify-content: center; align-items: center; }
    .frame-link { position: relative; display: block; text-decoration: none; cursor: pointer; transition: transform .3s ease; }
    .frame-link img { display: block; width: min(291px, calc((100vw - 98px) / 2)); max-width: 100%; height: auto; transition: opacity .3s ease, filter .3s ease; }
    .frame-link:hover { transform: scale(1.05); }
    .frame-link:hover img { filter: blur(2px); opacity: 0.8; }
    .hover-text { position: absolute; top: 50%; left: 50%; width: 100%; color: #fff; font-size: clamp(28px, 4vw, 48px); letter-spacing: 2px; text-align: center; text-shadow: 0 0 10px #000; opacity: 0; pointer-events: none; transform: translate(-50%, -50%); transition: opacity .3s ease; }
    .frame-link:hover .hover-text { opacity: 1; }
    
    /* 아이맥 스타일 팝업 (NOT YET) */
    .ready-popup { position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.38); backdrop-filter: blur(4px); }
    .ready-popup.show { display: flex; animation: fade-in .35s ease both; }
    .mac-popup-card { width: min(340px, 80vw); background: #fff; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.45); overflow: hidden; transform: translateY(16px) scale(0.94); transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1); }
    .ready-popup.show .mac-popup-card { transform: translateY(0) scale(1); }
    .mac-titlebar { display: flex; gap: 8px; padding: 12px 16px; background: #f6f6f6; border-bottom: 1px solid #e5e5e5; }
    .mac-dot { width: 12px; height: 12px; border-radius: 50%; border: none; padding: 0; cursor: pointer; transition: filter 0.2s; }
    .mac-dot:hover { filter: brightness(0.8); }
    .mac-dot.red { background: #ff5f57; }
    .mac-dot.yellow { background: #ffbd2e; }
    .mac-dot.green { background: #28c840; } 
    .mac-content { padding: 46px 20px; color: #171717; font-size: clamp(18px, 2.8vw, 24px); font-weight: bold; letter-spacing: 3px; text-align: center; }

    #cookieScreen { position: absolute; inset: 0; z-index: 1; display: none; overflow: hidden; flex-direction: column; justify-content: center; align-items: center; gap: 28px; background: #000; }
    #cookieScreen::before { position: absolute; inset: 0; z-index: 0; content: ''; background: url('geminibg.jpg') center / cover no-repeat; opacity: 0; filter: blur(4px); transform: translateY(18px) scale(.98); transition: opacity 1.2s ease, filter 1.2s ease, transform 1.2s ease; }
    #cookieScreen.sky-background::before { opacity: 1; filter: blur(0); transform: none; }
    .cookie-image, .cookie-actions { position: relative; z-index: 1; }
    .cookie-image { cursor: pointer; }
    .cookie-image img { display: block; width: min(420px, 78vw); height: auto; }
    .cookie-image .cookie-piece { position: absolute; inset: 0; opacity: 0; pointer-events: none; }
    .cookie-image .piece-one { clip-path: polygon(0 0,54% 0,47% 48%,0 54%); }
    .cookie-image .piece-two { clip-path: polygon(54% 0,100% 0,100% 52%,47% 48%); }
    .cookie-image .piece-three { clip-path: polygon(0 54%,47% 48%,53% 100%,0 100%); }
    .cookie-image .piece-four { clip-path: polygon(47% 48%,100% 52%,100% 100%,53% 100%); }
    .cookie-image.breaking .cookie-base { opacity: 0; }
    .cookie-image.breaking .cookie-piece { opacity: 1; animation: .8s cubic-bezier(.2,.8,.3,1) forwards; }
    .cookie-image.breaking .piece-one { animation-name: piece-one; }
    .cookie-image.breaking .piece-two { animation-name: piece-two; }
    .cookie-image.breaking .piece-three { animation-name: piece-three; }
    .cookie-image.breaking .piece-four { animation-name: piece-four; }
    @keyframes piece-one { to { transform: translate(-34px,-42px) rotate(-12deg); opacity: .78; } }
    @keyframes piece-two { to { transform: translate(38px,-30px) rotate(14deg); opacity: .78; } }
    @keyframes piece-three { to { transform: translate(-30px,44px) rotate(13deg); opacity: .78; } }
    @keyframes piece-four { to { transform: translate(42px,38px) rotate(-15deg); opacity: .78; } }
    
    /* 글씨 자체만 부드럽게 블러 처리 */
    .cookie-actions { display: flex; flex-direction: column; gap: 10px; align-items: center; min-height: 120px; }
    .or-text { color: rgba(255, 255, 255, 0.7); font-size: 11px; letter-spacing: 2px; text-transform: uppercase; margin: 4px 0; }
    .cookie-action { padding: 12px 24px; border: none; background: transparent; color: #fff; letter-spacing: 2px; cursor: pointer; outline: none; transition: filter 0.3s ease, opacity 0.3s ease; }
    .cookie-action:hover { filter: blur(3px); opacity: 0.8; }
    
    .fate-map { position: absolute; z-index: 2; width: min(760px, 88vw); opacity: 0; transform: translateY(-8vh) scale(.72) rotate(-5deg); pointer-events: none; transition: opacity .9s ease, transform .9s ease; }
    .fate-map.revealed { opacity: 1; transform: translateY(-8vh) scale(1) rotate(0deg); pointer-events: auto; }
    .fate-image { display: block; width: 100%; height: auto; }
    .planet-hotspot { position: absolute; width: clamp(22px,3vw,34px); aspect-ratio: 1; padding: 0; border: 1px solid rgba(255,255,255,.75); border-radius: 50%; background: rgba(255,255,255,.12); box-shadow: 0 0 16px rgba(255,255,255,.75); cursor: pointer; transform: translate(-50%,-50%); }
    .planet-hotspot:hover, .planet-hotspot.active { background: rgba(255,255,255,.35); box-shadow: 0 0 24px #fff; }
    .fate-modal { position: absolute; top: 50%; left: 50%; z-index: 5; display: none; width: min(420px,calc(100vw - 48px)); aspect-ratio: 1; flex-direction: column; overflow: hidden; border: 1px solid rgba(255,255,255,.35); border-radius: 24px; background: rgba(0,0,0,.8); color: #fff; box-shadow: 0 24px 70px rgba(0,0,0,.6); transform: translate(-50%,-50%) scale(.9); }
    .fate-modal.open { display: flex; animation: modal-open .3s ease-out forwards; }
    .fate-modal.portfolio-modal { background: #e8e5e0; color: #171717; }
    .modal-bar { display: flex; gap: 8px; padding: 16px 18px; }
    .window-control { width: 14px; height: 14px; padding: 0; border: 0; border-radius: 50%; cursor: pointer; }
    .window-control.close { background: #ff5f57; } .window-control.minimize { background: #ffbd2e; } .window-control.expand { background: #28c840; }
    .modal-content { display: flex; flex: 1; overflow-y: auto; align-items: center; justify-content: center; padding: 28px; font-size: clamp(18px,3vw,26px); letter-spacing: 2px; line-height: 1.5; text-align: center; }
    .profile-content { width: 100%; font-size: 15px; letter-spacing: .5px; line-height: 1.65; text-align: left; }
    .profile-content h2 { margin: 0 0 24px 0; font-size: clamp(14px,3vw,24px); letter-spacing: 1px; line-height: 1.2; }
    .profile-content p { margin: 0 0 8px 0; } .profile-content a { color: inherit; }
    .password-lock { display: flex; flex-direction: column; gap: 14px; margin-top: 0; }
    .password-subtitle, .password-question { margin: 0; line-height: 1.3; } .password-subtitle { font-size: 14px; } .password-question { font-size: 12px; opacity: .8; text-transform: none; }
    .password-form { display: flex; gap: 10px; align-items: center; } .password-input { flex: 1; min-width: 0; padding: 11px 12px; border: 1px solid rgba(255,255,255,.35); border-radius: 10px; background: rgba(255,255,255,.06); color: inherit; text-align: center; letter-spacing: 2px; } .password-button { padding: 11px 14px; border: 1px solid rgba(255,255,255,.35); border-radius: 10px; background: rgba(255,255,255,.08); color: inherit; cursor: pointer; }
    .wrong-feedback { min-height: 20px; color: #ff6b6b; font-size: 12px; opacity: 0; transition: opacity .2s; } .wrong-feedback.show { opacity: 1; }
    .secret-panel { max-height: 0; margin-top: 0; padding: 0 16px; border: 0px solid rgba(255,255,255,.12); border-radius: 14px; visibility: hidden; filter: blur(18px); opacity: 0; transform: scale(.98); overflow: hidden; transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1); } 
    .secret-panel.unlocked { max-height: 200px; margin-top: 16px; padding: 18px 16px; border-width: 1px; visibility: visible; filter: none; opacity: 1; transform: none; }
    
    @keyframes modal-open { to { transform: translate(-50%,-50%) scale(1); } } @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    @media (max-width: 768px) { .frame-container { gap: 12px; padding: 12px; } .frame-link img { width: auto; max-width: calc((100vw - 36px)/2); max-height: calc((100vh - 96px)/2); } }
  </style>
</head>
<body>
  <main id="mainScreen"><div class="frame-container">
    <a href="/open" class="frame-link" id="museionBtn"><img src="museionworks.png?v=3" alt="Museion Works Frame"><span class="hover-text">MUSEION<br>WORKS</span></a>
    <a href="/map" class="frame-link" id="suannBtn"><img src="suannpf.png?v=3" alt="Silver Frame"><span class="hover-text">SUANN</span></a>
  </div></main>
  
  <div class="ready-popup" id="readyPopup" aria-live="assertive">
    <div class="mac-popup-card">
      <div class="mac-titlebar">
        <button class="mac-dot red" id="closeReadyPopup"></button>
        <button class="mac-dot yellow"></button>
        <button class="mac-dot green"></button>
      </div>
      <div class="mac-content">NOT YET</div>
    </div>
  </div>

  <section id="cookieScreen">
    <div class="fate-map" id="fateImage"><img class="fate-image" src="constellation.png" alt="Constellation">
      <button class="planet-hotspot" data-popup="star-one" style="left:53.3%;top:10.1%" aria-label="Star one"></button>
      <button class="planet-hotspot" data-popup="star-two" style="left:44.7%;top:23%" aria-label="Star two"></button>
      <button class="planet-hotspot" data-popup="star-three" style="left:67.8%;top:51.5%" aria-label="Star three"></button>
      <button class="planet-hotspot" data-popup="star-four" style="left:55.5%;top:87.7%" aria-label="Star four"></button>
    </div>
    <div class="fate-modal" id="fateModal" role="dialog" aria-modal="true" aria-label="Star information"><div class="modal-bar"><button class="window-control close" id="closeModal" aria-label="Close window"></button><button class="window-control minimize" aria-label="Minimize window"></button><button class="window-control expand" aria-label="Expand window"></button></div><div class="modal-content" id="modalContent"></div></div>
    <div class="cookie-image" id="cookieImage"><img class="cookie-base" src="fortunecookie.png" alt="Fortune Cookie"><img class="cookie-piece piece-one" src="fortunecookie.png" alt=""><img class="cookie-piece piece-two" src="fortunecookie.png" alt=""><img class="cookie-piece piece-three" src="fortunecookie.png" alt=""><img class="cookie-piece piece-four" src="fortunecookie.png" alt=""></div>
    
    <div class="cookie-actions">
      <button class="cookie-action" id="breakButton">BREAK YOUR FATE (click the cookie)</button>
      <span class="or-text">or you can choose</span>
      <button class="cookie-action" id="returnButton">RETURN TO MAIN</button>
    </div>
  </section>
  <script>
    const $ = (selector) => document.querySelector(selector);
    const mainScreen = $('#mainScreen');
    const cookieScreen = $('#cookieScreen');
    const cookieImage = $('#cookieImage');
    const fateImage = $('#fateImage');
    const fateModal = $('#fateModal');
    const modalContent = $('#modalContent');
    const popupContents = {
      'star-one': '<div class="profile-content"><h2>STAR I THE BEGINNING</h2><p>suann, Based in Incheon and Seoul, Korea</p><p>- photography<br>- design</p><p>contact.</p><p>- email: <a href="mailto:ahnsuann@kakao.com">ahnsuann@kakao.com</a><br>- instagram: <a href="https://instagram.com/museionworks" target="_blank" rel="noopener noreferrer">@museionworks</a></p></div>',
      'star-two': '<div class="profile-content"><h2>STAR II THE CROSSING</h2><p><a href="/map/portfolio/" style="text-decoration: underline; text-underline-offset: 4px;">PORTFOLIO</a></p></div>',
      'star-three': '<div class="profile-content"><h2>STAR III THE CHOICE</h2><p>THE CHOICE IS YOURS.</p></div>',
      'star-four': '<div class="profile-content"><h2>STAR IV THE DESTINY</h2><div class="password-lock"><div style="display:flex; flex-direction:column; gap:4px;"><p class="password-subtitle">수안의 생일 여섯자리를 입력해주세요.</p><p class="password-question">When is suann\'s birthday? Enter the 6digit number.</p></div><div class="password-form"><input class="password-input" type="password" inputmode="numeric" maxlength="6" placeholder="000000" aria-label="Password input"><button class="password-button" type="button">ENTER</button></div><div class="wrong-feedback" aria-live="polite"></div><div class="secret-panel"><p>Personal Blog: <a href="https://blog.naver.com/ahnsuann" target="_blank" rel="noopener noreferrer">@ahnsuann</a></p><p>Personal Instagram: <a href="https://www.instagram.com/newan9el/" target="_blank" rel="noopener noreferrer">@newan9el</a></p></div></div></div>'
    };
    
    $('#museionBtn').addEventListener('click', (event) => { 
      event.preventDefault(); 
      history.pushState(null, '', '/open');
      $('#readyPopup').classList.add('show'); 
    });
    
    $('#closeReadyPopup').addEventListener('click', (event) => {
      event.stopPropagation();
      $('#readyPopup').classList.remove('show');
    });

    $('#readyPopup').addEventListener('click', (event) => { 
      if (event.target === $('#readyPopup')) {
        $('#readyPopup').classList.remove('show'); 
      }
    });
    
    $('#suannBtn').addEventListener('click', (event) => { 
      event.preventDefault(); 
      history.pushState(null, '', '/map');
      mainScreen.classList.add('melt'); 
      cookieImage.classList.remove('breaking'); 
      fateImage.classList.remove('revealed'); 
      cookieScreen.classList.remove('sky-background'); 
      fateModal.classList.remove('open'); 
      cookieScreen.style.display = 'flex'; 
      setTimeout(() => mainScreen.style.display = 'none', 2000); 
    });
    
    $('#returnButton').addEventListener('click', () => { 
      history.pushState(null, '', '/');
      cookieScreen.style.display = 'none'; 
      mainScreen.style.display = 'flex'; 
      mainScreen.classList.remove('melt'); 
    });
    
    const breakCookie = () => { cookieImage.classList.remove('breaking'); void cookieImage.offsetWidth; cookieImage.classList.add('breaking'); fateImage.classList.remove('revealed'); cookieScreen.classList.add('sky-background'); setTimeout(() => fateImage.classList.add('revealed'), 700); };
    cookieImage.addEventListener('click', breakCookie); $('#breakButton').addEventListener('click', breakCookie);
    document.querySelectorAll('.planet-hotspot').forEach((hotspot) => hotspot.addEventListener('click', (event) => { event.stopPropagation(); document.querySelectorAll('.planet-hotspot').forEach((item) => item.classList.remove('active')); hotspot.classList.add('active'); modalContent.innerHTML = popupContents[hotspot.dataset.popup]; fateModal.classList.toggle('portfolio-modal', hotspot.dataset.popup === 'star-two'); fateModal.classList.add('open'); }));
    modalContent.addEventListener('click', (event) => { if (!event.target.closest('.password-button')) return; const input = $('.password-input'); const feedback = $('.wrong-feedback'); const secretPanel = $('.secret-panel'); if (input && input.value.trim() === '990603') { feedback.classList.remove('show'); secretPanel.classList.add('unlocked'); } else { if (feedback) { feedback.textContent = 'Your password is incorrect'; feedback.classList.add('show'); } if (input) input.value = ''; } });
    modalContent.addEventListener('keydown', (event) => { if (event.key === 'Enter' && event.target.classList.contains('password-input')) { event.preventDefault(); $('.password-button').click(); } });
    $('#closeModal').addEventListener('click', () => { fateModal.classList.remove('open', 'portfolio-modal'); document.querySelectorAll('.planet-hotspot').forEach((item) => item.classList.remove('active')); });
  </script>
</body>
</html>
