
<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Ahn Suann Portfolio</title>
	<style>
		* {
			font-family: Helvetica, Arial, sans-serif;
		}

		html, body {
			width: 100%;
			height: 100vh;
			margin: 0;
			padding: 0;
			overflow: hidden;
			background: #000 url('mainbackground.jpg') center / cover no-repeat fixed;
			font-family: Helvetica, Arial, sans-serif;
		}

		#mainScreen {
			position: absolute;
			inset: 0;
			z-index: 10;
			display: flex;
			justify-content: center;
			align-items: center;
			background-color: #e8e5e0;
			background-image:
				radial-gradient(ellipse at 18% 16%, rgba(255, 255, 255, 0.2), transparent 38%),
				radial-gradient(ellipse at 82% 74%, rgba(83, 76, 69, 0.08), transparent 42%);
			transition: opacity 2s ease, filter 2s ease, transform 2s ease;
		}

		#mainScreen.melt {
			opacity: 0;
			filter: blur(15px);
			transform: scale(0.97);
		}

		.frame-container {
			box-sizing: border-box;
			width: 100%;
			padding: 24px;
			display: flex;
			gap: 50px;
			justify-content: center;
			align-items: center;
		}

		.frame-link {
			position: relative;
			display: block;
			text-decoration: none;
			cursor: pointer;
			transition: transform 0.3s ease;
		}

		.ready-popup {
			position: fixed;
			inset: 0;
			display: none;
			align-items: center;
			justify-content: center;
			z-index: 50;
			background: rgba(0, 0, 0, 0.38);
			backdrop-filter: blur(4px);
			opacity: 0;
			transition: opacity 0.35s ease;
		}

		.ready-popup.show {
			display: flex;
			opacity: 1;
		}

		.ready-popup-card {
			padding: 26px 34px;
			border: 1px solid rgba(255, 255, 255, 0.35);
			border-radius: 18px;
			background: rgba(0, 0, 0, 0.7);
			color: #fff;
			font-size: clamp(18px, 2.8vw, 30px);
			letter-spacing: 2px;
			text-align: center;
			box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255,255,255,0.14);
			transform: translateY(16px) scale(0.94);
			opacity: 0;
			transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.35s ease;
		}

		.ready-popup.show .ready-popup-card {
			transform: translateY(0) scale(1);
			opacity: 1;
		}

		.frame-link img {
			display: block;
			width: min(291px, calc((100vw - 98px) / 2));
			max-width: 100%;
			height: auto;
			transition: opacity 0.3s ease, filter 0.3s ease;
		}

		.hover-text {
			position: absolute;
			top: 50%;
			left: 50%;
			width: 100%;
			color: #fff;
			font-size: 48px;
			letter-spacing: 2px;
			text-align: center;
			text-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
			opacity: 0;
			pointer-events: none;
			transform: translate(-50%, -50%);
			transition: opacity 0.3s ease;
		}

		.frame-link:hover {
			transform: scale(1.05);
		}

		.frame-link:hover img {
			opacity: 1;
			filter: blur(2px);
		}

		.frame-link:hover .hover-text {
			opacity: 1;
		}

		#cookieScreen {
			position: absolute;
			inset: 0;
			z-index: 1;
			display: none;
			background: #000;
			overflow: hidden;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			gap: 28px;
		}

		#cookieScreen.sky-background {
			background: #000;
		}

		#cookieScreen::before {
			position: absolute;
			inset: 0;
			z-index: 0;
			content: '';
			background: url('geminibg.jpg') center / cover no-repeat;
			opacity: 0;
			filter: blur(4px);
			transform: translateY(18px) scale(0.98);
			transition: opacity 1.2s ease-out, filter 1.2s ease-out, transform 1.2s ease-out;
		}

		#cookieScreen.sky-background::before {
			opacity: 1;
			filter: blur(0);
			transform: translateY(0) scale(1);
		}

		.fate-map {
			position: absolute;
			z-index: 2;
			width: min(760px, 88vw);
			opacity: 0;
			transform: scale(0.72) rotate(-5deg);
			pointer-events: none;
			transition: opacity 0.9s ease, transform 0.9s ease;
		}

		.fate-map.revealed {
			opacity: 1;
			transform: scale(1) rotate(0);
			pointer-events: auto;
		}

		.fate-map .fate-image {
			display: block;
			width: 100%;
			height: auto;
		}

		.planet-hotspot {
			position: absolute;
			width: clamp(22px, 3vw, 34px);
			aspect-ratio: 1;
			padding: 0;
			border: 1px solid rgba(255, 255, 255, 0.75);
			border-radius: 50%;
			background: rgba(255, 255, 255, 0.12);
			box-shadow: 0 0 16px rgba(255, 255, 255, 0.75);
			cursor: pointer;
			transform: translate(-50%, -50%);
		}

		.planet-hotspot:hover,
		.planet-hotspot.active {
			background: rgba(255, 255, 255, 0.35);
			box-shadow: 0 0 24px rgba(255, 255, 255, 1);
		}

		.planet-popup {
			display: none;
		}

		.fate-modal {
			position: absolute;
			top: 50%;
			left: 50%;
			z-index: 5;
			display: none;
			width: min(420px, calc(100vw - 48px));
			aspect-ratio: 1;
			flex-direction: column;
			overflow: hidden;
			border: 1px solid rgba(255, 255, 255, 0.35);
			border-radius: 24px;
			background: rgba(0, 0, 0, 0.8);
			box-shadow: 0 24px 70px rgba(0, 0, 0, 0.6);
			transform: translate(-50%, -50%) scale(0.9);
		}

		.fate-modal.portfolio-modal {
			background: #e8e5e0;
			color: #171717;
		}

		.portfolio-modal .modal-content {
			color: #171717;
		}

		.portfolio-modal .profile-content a {
			color: #171717;
		}

		.fate-modal.open {
			display: flex;
			animation: modal-open 0.3s ease-out forwards;
		}

		.modal-bar {
			width: min(420px, calc(100vw - 48px));
			gap: 8px;
			padding: 16px 18px;
		}

		.window-control {
			width: 14px;
			height: 14px;
			padding: 0;
			border: 0;
			border-radius: 50%;
			cursor: pointer;
			transition: transform 0.2s ease, filter 0.2s ease;
		}

		.window-control:hover {
			filter: brightness(1.2);
			transform: scale(1.15);
		}

		.window-control.close {
			background: #ff5f57;
		}

		.window-control.minimize {
			background: #ffbd2e;
		}

		.window-control.expand {
			background: #28c840;
		}

		.modal-content {
			display: flex;
			flex: 1;
			overflow-y: auto;
			justify-content: center;
			align-items: center;
			padding: 28px;
			color: #fff;
			font-size: clamp(18px, 3vw, 26px);
			letter-spacing: 2px;
			line-height: 1.5;
			text-align: center;
		}

		.profile-content {
			width: 100%;
			font-size: 15px;
			letter-spacing: 0.5px;
			line-height: 1.65;
			text-align: left;
		}

		.profile-content h2 {
			margin: 0 0 18px;
			font-size: clamp(14px, 3vw, 24px);
			letter-spacing: 1px;
			line-height: 1.2;
			white-space: nowrap;
		}

		.profile-content p {
			margin: 8px 0;
		}

		.profile-content a {
			color: #fff;
		}

		.profile-content .plain-link {
			color: inherit;
			text-decoration: none;
			pointer-events: none;
		}

		.password-lock {
			display: flex;
			flex-direction: column;
			gap: 12px;
			margin-top: 10px;
		}

		.password-question {
			margin: 0;
			font-size: 12px;
			letter-spacing: 1.2px;
			line-height: 1.3;
			text-transform: none;
			opacity: 0.8;
		}

		.password-subtitle {
			margin: 0;
			font-size: 14px;
			letter-spacing: 1px;
			line-height: 1.3;
			opacity: 0.95;
		}

		.password-form {
			display: flex;
			gap: 10px;
			align-items: center;
		}

		.password-input {
			flex: 1;
			min-width: 0;
			padding: 11px 12px;
			border: 1px solid rgba(255, 255, 255, 0.35);
			border-radius: 10px;
			background: rgba(255, 255, 255, 0.06);
			color: #fff;
			font: inherit;
			text-align: center;
			letter-spacing: 2px;
		}

		.password-input:focus {
			outline: 1px solid rgba(255, 255, 255, 0.7);
		}

		.password-button {
			padding: 11px 14px;
			border: 1px solid rgba(255, 255, 255, 0.35);
			border-radius: 10px;
			background: rgba(255, 255, 255, 0.08);
			color: #fff;
			font: inherit;
			letter-spacing: 1px;
			cursor: pointer;
		}

		.wrong-feedback {
			opacity: 0;
			min-height: 20px;
			font-size: 12px;
			letter-spacing: 1.5px;
			color: #ff6b6b;
			transition: opacity 0.2s ease;
		}

		.wrong-feedback.show {
			opacity: 1;
		}

		.secret-panel {
			margin-top: 16px;
			padding: 18px 16px;
			border-radius: 14px;
			background: rgba(255, 255, 255, 0.04);
			border: 1px solid rgba(255, 255, 255, 0.12);
			visibility: hidden;
			filter: blur(18px);
			opacity: 0;
			transform: scale(0.98);
			transition: filter 1.2s ease, opacity 1.2s ease, transform 1.2s ease, visibility 0s linear 1.2s;
		}

		.secret-panel.unlocked {
			visibility: visible;
			filter: blur(0);
			opacity: 1;
			transform: scale(1);
			transition: filter 1.2s ease, opacity 1.2s ease, transform 1.2s ease, visibility 0s linear 0s;
		}

		.secret-panel p {
			margin: 8px 0;
			font-size: 14px;
			letter-spacing: 0.8px;
		}

		@keyframes modal-open {
			to { transform: translate(-50%, -50%) scale(1); }
		}

		.cookie-image {
			position: relative;
			z-index: 1;
			cursor: pointer;
		}

		.cookie-image img {
			display: block;
			width: min(420px, 78vw);
			height: auto;
		}

		.cookie-image .cookie-piece {
			position: absolute;
			inset: 0;
			opacity: 0;
			object-fit: fill;
			pointer-events: none;
		}

		.cookie-image .piece-one {
			clip-path: polygon(0 0, 54% 0, 47% 48%, 0 54%);
		}

		.cookie-image .piece-two {
			clip-path: polygon(54% 0, 100% 0, 100% 52%, 47% 48%);
		}

		.cookie-image .piece-three {
			clip-path: polygon(0 54%, 47% 48%, 53% 100%, 0 100%);
		}

		.cookie-image .piece-four {
			clip-path: polygon(47% 48%, 100% 52%, 100% 100%, 53% 100%);
		}

		.cookie-image.breaking .cookie-base {
			opacity: 0;
		}

		.cookie-image.breaking .cookie-piece {
			opacity: 1;
			animation-duration: 0.8s;
			animation-fill-mode: forwards;
			animation-timing-function: cubic-bezier(0.2, 0.8, 0.3, 1);
		}

		.cookie-image.breaking .piece-one {
			animation-name: piece-one-break;
		}

		.cookie-image.breaking .piece-two {
			animation-name: piece-two-break;
		}

		.cookie-image.breaking .piece-three {
			animation-name: piece-three-break;
		}

		.cookie-image.breaking .piece-four {
			animation-name: piece-four-break;
		}

		@keyframes piece-one-break {
			to { transform: translate(-34px, -42px) rotate(-12deg); opacity: 0.78; }
		}

		@keyframes piece-two-break {
			to { transform: translate(38px, -30px) rotate(14deg); opacity: 0.78; }
		}

		@keyframes piece-three-break {
			to { transform: translate(-30px, 44px) rotate(13deg); opacity: 0.78; }
		}

		@keyframes piece-four-break {
			to { transform: translate(42px, 38px) rotate(-15deg); opacity: 0.78; }
		}

		.cookie-actions {
			position: relative;
			z-index: 3;
			display: flex;
			flex-direction: column;
			gap: 16px;
			justify-content: center;
			align-items: center;
			flex-wrap: wrap;
			min-height: 120px;
			margin-top: 8px;
		}

		.cookie-action {
			padding: 10px 22px;
			border: none;
			background: transparent;
			color: #fff;
			font: inherit;
			letter-spacing: 2px;
			cursor: pointer;
			transition: background-color 0.3s ease, color 0.3s ease;
		}

		.cookie-action:hover {
			background-color: #fff;
			color: #000;
		}

		@media (max-width: 768px) {
			.frame-container {
				flex-direction: row;
				gap: 12px;
				padding: 12px;
			}

			.frame-link img {
				width: auto;
				max-width: calc((100vw - 36px) / 2);
				max-height: calc((100vh - 96px) / 2);
			}

			.hover-text {
				font-size: 40px;
			}
		}
	</style>
</head>
<body>
	<div id="mainScreen">
		<div class="frame-container">
			<a href="#" class="frame-link" id="museionBtn">
				<img src="./museionworks.png" alt="Museion Works Frame" loading="eager" decoding="async">
				<span class="hover-text">MUSEION<br>WORKS</span>
			</a>

			<a href="#" class="frame-link" id="suannBtn">
				<img src="suannpf.png" alt="Silver Frame">
				<span class="hover-text">SUANN</span>
			</a>
		</div>
	</div>

	<div class="ready-popup" id="readyPopup" aria-live="assertive">
		<div class="ready-popup-card">WAIT FOR READY</div>
	</div>

	<div id="cookieScreen">
		<div class="fate-map" id="fateImage">
			<img class="fate-image" src="ChatGPT Image 2026년 9월 11일 오후 04_26_52.png" alt="Constellation">
			<button class="planet-hotspot" type="button" data-popup="star-one" style="left: 53.3%; top: 10.1%;" aria-label="Star one">
				<span class="planet-popup">STAR I<br>THE BEGINNING</span>
			</button>
			<button class="planet-hotspot" type="button" data-popup="star-two" style="left: 44.7%; top: 23%;" aria-label="Star two">
				<span class="planet-popup">STAR II<br>THE CROSSING</span>
			</button>
			<button class="planet-hotspot" type="button" data-popup="STAR III&lt;br&gt;THE CHOICE" style="left: 67.8%; top: 51.5%;" aria-label="Star three">
				<span class="planet-popup">STAR III<br>THE CHOICE</span>
			</button>
			<button class="planet-hotspot" type="button" data-popup="star-four" style="left: 55.5%; top: 87.7%;" aria-label="Star four">
				<span class="planet-popup">STAR IV<br>THE DESTINY</span>
			</button>
		</div>
		<div class="fate-modal" id="fateModal" role="dialog" aria-modal="true" aria-label="Star information">
			<div class="modal-bar">
				<button class="window-control close" id="closeModal" type="button" aria-label="Close window"></button>
				<button class="window-control minimize" type="button" aria-label="Minimize window"></button>
				<button class="window-control expand" type="button" aria-label="Expand window"></button>
			</div>
			<div class="modal-content" id="modalContent"></div>
		</div>
		<div class="cookie-image" id="cookieImage">
			<img class="cookie-base" src="fortunecookie.png" alt="Fortune Cookie">
			<img class="cookie-piece piece-one" src="fortunecookie.png" alt="">
			<img class="cookie-piece piece-two" src="fortunecookie.png" alt="">
			<img class="cookie-piece piece-three" src="fortunecookie.png" alt="">
			<img class="cookie-piece piece-four" src="fortunecookie.png" alt="">
		</div>
		<div class="cookie-actions">
			<button type="button" class="cookie-action" id="returnButton">RETURN TO MAIN</button>
			<button type="button" class="cookie-action" id="breakButton">BREAK YOUR FATE (click the cookie)</button>
		</div>
	</div>

	<script>
		document.getElementById('museionBtn').addEventListener('click', function (event) {
			event.preventDefault();
			document.getElementById('readyPopup').classList.add('show');
			setTimeout(() => {
				document.getElementById('readyPopup').classList.remove('show');
			}, 1400);
		});

		document.getElementById('readyPopup').addEventListener('click', function () {
			this.classList.remove('show');
		});

		document.getElementById('suannBtn').addEventListener('click', function (event) {
			event.preventDefault();

			const mainScreen = document.getElementById('mainScreen');
			const cookieScreen = document.getElementById('cookieScreen');
			const cookieImage = document.getElementById('cookieImage');
			const fateImage = document.getElementById('fateImage');

			mainScreen.classList.add('melt');
			cookieImage.classList.remove('breaking');
			fateImage.classList.remove('revealed');
			cookieScreen.classList.remove('sky-background');
			document.querySelectorAll('.planet-hotspot').forEach((hotspot) => {
				hotspot.classList.remove('active');
			});
			document.getElementById('fateModal').classList.remove('open');
			cookieScreen.style.display = 'flex';

			setTimeout(() => {
				mainScreen.style.display = 'none';
			}, 2000);
		});

		document.getElementById('returnButton').addEventListener('click', function () {
			const mainScreen = document.getElementById('mainScreen');
			const cookieScreen = document.getElementById('cookieScreen');

			cookieScreen.style.display = 'none';
			mainScreen.style.display = 'flex';
			mainScreen.classList.remove('melt');
		});

		document.getElementById('cookieImage').addEventListener('click', function () {
			this.classList.remove('breaking');
			void this.offsetWidth;
			this.classList.add('breaking');
			document.getElementById('fateImage').classList.remove('revealed');
			document.getElementById('cookieScreen').classList.add('sky-background');
			setTimeout(() => {
				document.getElementById('fateImage').classList.add('revealed');
			}, 700);
		});

		document.getElementById('breakButton').addEventListener('click', function () {
			document.getElementById('cookieImage').click();
		});

		const fateModal = document.getElementById('fateModal');
		const modalContent = document.getElementById('modalContent');
		const popupContents = {
			'star-one': `
				<div class="profile-content">
					<h2>STAR I THE BEGINNING</h2>
					<p>suann, Based in Incheon and Seoul, Korea</p>
					<p>- photography<br>- design</p>
					<p>contact.</p>
					<p>- email: <a href="mailto:ahnsuann@kakao.com">ahnsuann@kakao.com</a><br>- instagram: <a href="https://instagram.com/museionworks" target="_blank" rel="noopener noreferrer">@museionworks</a></p>
				</div>
			`,
			'star-two': `
				<div class="profile-content">
					<h2>STAR II THE CROSSING</h2>
					<p><span class="plain-link">WAIT FOR BEGINNING</span></p>
				</div>
			`,
			'star-four': `
				<div class="profile-content">
					<h2>STAR IV THE DESTINY</h2>
					<div class="password-lock">
						<p class="password-subtitle">수안의 생일 여섯자리를 입력해주세요.</p>
						<p class="password-question">When is suann's birthday? Enter the 6digit number.</p>
						<div class="password-form">
							<input class="password-input" type="password" inputmode="numeric" maxlength="6" placeholder="000000" aria-label="Password input">
							<button class="password-button" type="button">ENTER</button>
						</div>
						<div class="wrong-feedback" aria-live="polite"></div>
						<div class="secret-panel">
							<p>Personal Blog: <a href="https://blog.naver.com/ahnsuann" target="_blank" rel="noopener noreferrer">@ahnsuann</a></p>
							<p>Personal Instagram: <a href="https://www.instagram.com/newan9el/" target="_blank" rel="noopener noreferrer">@newan9el</a></p>
						</div>
					</div>
				</div>
			`
		};

		document.querySelectorAll('.planet-hotspot').forEach((hotspot) => {
			hotspot.addEventListener('click', function (event) {
				event.stopPropagation();
				modalContent.innerHTML = popupContents[this.dataset.popup] || this.dataset.popup;
				fateModal.classList.toggle('portfolio-modal', this.dataset.popup === 'star-two');
				fateModal.classList.add('open');
			});
		});

		modalContent.addEventListener('click', function (event) {
			const button = event.target.closest('.password-button');
			if (!button) return;

			const input = modalContent.querySelector('.password-input');
			const feedback = modalContent.querySelector('.wrong-feedback');
			const secretPanel = modalContent.querySelector('.secret-panel');
			const value = (input ? input.value.trim() : '');

			if (value === '990603') {
				feedback.classList.remove('show');
				feedback.textContent = '';
				secretPanel.classList.add('unlocked');
				return;
			}

			feedback.textContent = 'know Your Wrong';
			feedback.classList.add('show');
			input.value = '';
			fateModal.animate([
				{ transform: 'translate(-50%, -50%) scale(1) rotate(0deg)' },
				{ transform: 'translate(-50%, -50%) scale(1) rotate(-2deg) translateX(-14px)' },
				{ transform: 'translate(-50%, -50%) scale(1) rotate(2deg) translateX(12px)' },
				{ transform: 'translate(-50%, -50%) scale(1) rotate(-1deg) translateX(-8px)' },
				{ transform: 'translate(-50%, -50%) scale(1) rotate(0deg) translateX(0)' }
			], {
				duration: 400,
				easing: 'ease-in-out',
				iterations: 1
			});
		});

		modalContent.addEventListener('keydown', function (event) {
			if (event.key !== 'Enter' || !event.target.classList.contains('password-input')) return;
			event.preventDefault();
			event.target.closest('.password-form').querySelector('.password-button').click();
		});

		document.getElementById('closeModal').addEventListener('click', function () {
			fateModal.classList.remove('open');
			fateModal.classList.remove('portfolio-modal');
		});
	</script>
</body>
</html>
