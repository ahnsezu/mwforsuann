<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Visual Design | Suann</title>
	<style>
		:root { --paper: #e8e5e0; --ink: #171717; --line: rgba(23, 23, 23, 0.22); }
		* { box-sizing: border-box; }
		html, body { min-height: 100%; margin: 0; background: var(--paper); color: var(--ink); font-family: Helvetica, Arial, sans-serif; }
		body { padding: 32px; }
		.page { max-width: 1200px; margin: 0 auto; }
		header { display: flex; justify-content: space-between; align-items: baseline; gap: 24px; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
		h1 { margin: 0; font-size: clamp(30px, 6vw, 76px); font-weight: 400; letter-spacing: 1px; line-height: 1; }
		a { color: inherit; text-decoration: none; }
		a:hover { text-decoration: underline; text-underline-offset: 4px; }
		nav { font-size: 13px; letter-spacing: 1px; text-transform: uppercase; }
		.intro { max-width: 650px; margin: 50px 0 70px; font-size: clamp(20px, 3vw, 34px); line-height: 1.3; }
		.project { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; padding: 22px 0; border-top: 1px solid var(--line); }
		.project img { width: 100%; height: 360px; object-fit: contain; background: #d5d1ca; }
		.project h2 { margin: 0 0 14px; font-size: clamp(22px, 3vw, 38px); font-weight: 400; }
		.project p { max-width: 380px; margin: 0; font-size: 15px; line-height: 1.6; }
		footer { padding: 70px 0 20px; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; }
		@media (max-width: 680px) { body { padding: 20px; } header { align-items: flex-start; flex-direction: column; gap: 18px; } .project { grid-template-columns: 1fr; } .project img { height: 260px; } }
	</style>
</head>
<body>
	<main class="page">
		<header>
			<h1>VISUAL DESIGN</h1>
			<nav><a href="new-portfolio.html">Back to portfolio</a></nav>
		</header>
		<p class="intro">Visual systems, image-making and direction.<br>Selected design work by suann.</p>
		<section class="project">
			<img src="museionworks.png" alt="Museion Works frame">
			<div>
				<h2>Museion Works</h2>
				<p>Visual direction and design work for an independent creative platform, combining image, typography and atmosphere.</p>
			</div>
		</section>
		<footer>ahnsuann@kakao.com</footer>
	</main>
</body>
</html>
