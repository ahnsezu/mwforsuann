<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>IDOL | Suann</title>

	<style>
		:root {
			--paper: #e8e5e0;
			--ink: #171717;
			--line: rgba(23, 23, 23, 0.22);
		}

		* {
			box-sizing: border-box;
		}

		html,
		body {
			min-height: 100%;
			margin: 0;
			background: var(--paper);
			color: var(--ink);
			font-family: Helvetica, Arial, sans-serif;
		}

		body {
			padding: 32px;
		}

		.page {
			max-width: 1200px;
			margin: 0 auto;
		}

		header {
			display: flex;
			justify-content: space-between;
			align-items: baseline;
			gap: 24px;
			padding-bottom: 18px;
			border-bottom: 1px solid var(--line);
		}

		h1 {
			margin: 0;
			font-size: clamp(30px, 6vw, 76px);
			font-weight: 400;
			letter-spacing: 1px;
			line-height: 1;
		}

		a {
			color: inherit;
			text-decoration: none;
		}

		a:hover {
			text-decoration: underline;
			text-underline-offset: 4px;
		}

		nav {
			font-size: 13px;
			letter-spacing: 1px;
			text-transform: uppercase;
		}

		.intro {
			max-width: 620px;
			margin: 50px 0 60px;
			font-size: clamp(20px, 3vw, 34px);
			line-height: 1.3;
		}

		.gallery {
			display: grid;
			grid-template-columns: repeat(4, minmax(0, 1fr));
			gap: 12px;
		}

		.gallery figure {
			margin: 0;
		}

		.gallery a {
			display: block;
		}

		.gallery img {
			display: block;
			width: 100%;
			aspect-ratio: 1 / 1.35;
			object-fit: contain;
			background: #d5d1ca;
			transition: opacity 0.25s ease;
		}

		.gallery a:hover img {
			opacity: 0.65;
		}

		.gallery figcaption {
			padding-top: 8px;
			font-size: 11px;
			letter-spacing: 1px;
		}

		@media (max-width: 680px) {
			body {
				padding: 20px;
			}

			header {
				align-items: flex-start;
				flex-direction: column;
				gap: 18px;
			}

			.gallery {
				grid-template-columns: repeat(2, minmax(0, 1fr));
			}
		}
	</style>
</head>

<body>

	<main class="page">

		<header>
			<h1>IDOL</h1>

			<nav>
				<a href="/map/portfolio/photography/portraits/">
					BACK TO PORTRAITS
				</a>
			</nav>
		</header>

		<p class="intro">
			Selected idol portrait projects by suann.
		</p>

		<section class="gallery" aria-label="Idol groups">

			<!-- 01. GROUP 01 -->
		<a href="txt/">
	<img src="txt.png" alt="TXT ・ 투모로우바이투게더">
	<figcaption>01. TXT ・ 투모로우바이투게더</figcaption>
</a>
			</figure>

			<!-- 02. GROUP 02 -->
			<figure>
				<a href="group-02/">
					<img src="group-02.png" alt="Group 02">
					<figcaption>02. GROUP 02</figcaption>
				</a>
			</figure>

			<!-- 03. GROUP 03 -->
			<figure>
				<a href="group-03/">
					<img src="group-03.png" alt="Group 03">
					<figcaption>03. GROUP 03</figcaption>
				</a>
			</figure>

			<!-- 04. GROUP 04 -->
			<figure>
				<a href="group-04/">
					<img src="group-04.png" alt="Group 04">
					<figcaption>04. GROUP 04</figcaption>
				</a>
			</figure>

			<!-- 05. GROUP 05 -->
			<figure>
				<a href="group-05/">
					<img src="group-05.png" alt="Group 05">
					<figcaption>05. GROUP 05</figcaption>
				</a>
			</figure>

			<!-- 06. GROUP 06 -->
			<figure>
				<a href="group-06/">
					<img src="group-06.png" alt="Group 06">
					<figcaption>06. GROUP 06</figcaption>
				</a>
			</figure>

		</section>

	</main>

</body>
</html>
